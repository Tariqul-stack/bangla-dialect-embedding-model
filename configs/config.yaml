model:
  vocab_size: 101975
  d_model: 128
  n_layers: 2
  embed_dim: 128
  d_state: 16
  d_conv: 4
  expand: 2
  headdim: 64
  dropout: 0.1

training:
  batch_size: 16
  learning_rate: 0.0001
  epochs: 10
  seed: 42
  weight_decay: 0.01
  checkpoint_dir: "checkpoints"
  temperature: 0.07
  loss: "nt_xent"       
  margin: 1.0  

data:
  excel_path: "data/raw/Local_Language_Dataset.xlsx"
  max_seq_len: 128
  train_ratio: 0.8
  val_ratio: 0.1

tokenizer:
  name: "sagorsarker/bangla-bert-base"